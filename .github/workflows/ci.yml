name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Unit tests
        run: node --test
      - name: Lint (file-size and import checks)
        run: node scripts/check.mjs
      - name: CLI smoke test
        run: node bin/tokenmonitor.js --help
      - name: Package contents
        run: npm pack --dry-run
