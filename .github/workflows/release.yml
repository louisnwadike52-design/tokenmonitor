# Publishes tokenmonitor to npm with provenance.
#
# Two ways it authenticates (configure ONE — see RELEASING.md):
#   1. Trusted Publishing (OIDC)  — no secrets; the optimal long-term setup.
#   2. Automation token           — set the NPM_TOKEN repository secret.
#
# Trigger by pushing a version tag (git push --tags after `npm version`),
# or run it manually from the Actions tab (workflow_dispatch).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Never run two publishes for the same ref at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm provenance and Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      # Trusted Publishing / provenance need npm >= 11.5.1.
      - name: Use latest npm
        run: npm install -g npm@latest

      - name: Verify the tag matches package.json
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG does not match package.json $PKG"; exit 1; }

      - name: Test
        run: node --test

      - name: Lint (zero-dep + file-size gate)
        run: node scripts/check.mjs

      # publishConfig in package.json sets access:public and provenance:true,
      # so `npm publish` alone is enough. NODE_AUTH_TOKEN is used only when
      # Trusted Publishing is not configured.
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
